name: Release

on:
  push:
    tags: "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typeface:
          [
            "Zenbones-Mono",
            "Zenbones-Slab",
            "Zenbones-Brainy",
            "Zenbones-Proto",
            "Zenbones-Prose",
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ttfautohint
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint

      - name: Clone Iosevka
        run: |
          cd ..
          iosevka_version=$(cat ./zenbones-mono/.iosevka-version)
          git clone --depth 1 https://github.com/be5invis/Iosevka.git
          cd Iosevka
          git fetch --tags --quiet
          git checkout tags/${iosevka_version}

      - name: Build Zenbones Mono
        run: |
          cd ../Iosevka
          cp ../zenbones-mono/private-build-plans.toml ./private-build-plans.toml
          npm install
          npm run build -- contents::${{ matrix.typeface }}

      - name: Zip build files
        run: |
          cd ../Iosevka/dist/${{ matrix.typeface }}
          zip -r ${{ matrix.typeface }}-TTF.zip TTF
          zip -r ${{ matrix.typeface }}-TTF-Unhinted.zip TTF-Unhinted
          zip -r ${{ matrix.typeface }}-WOFF2.zip WOFF2 ${{ matrix.typeface }}.css
          zip -r ${{ matrix.typeface }}-WOFF2-Unhinted.zip WOFF2-Unhinted ${{ matrix.typeface }}-Unhinted.css

      - name: Upload zip file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.typeface }}
          path: /home/runner/work/zenbones-mono/Iosevka/dist/${{ matrix.typeface }}/*.zip

  nerd-font:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Zenbones-Brainy artifact
        uses: actions/download-artifact@v4
        with:
          name: Zenbones-Brainy
          path: artifacts

      - name: Extract TTFs
        run: unzip artifacts/Zenbones-Brainy-TTF.zip -d artifacts

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge

      - name: Clone Nerd Fonts font-patcher
        run: |
          git clone --filter=blob:none --sparse https://github.com/ryanoasis/nerd-fonts.git
          cd nerd-fonts
          git sparse-checkout add font-patcher src/glyphs

      - name: Patch fonts with Nerd Font glyphs
        run: |
          mkdir -p patched
          for ttf in artifacts/TTF/*.ttf; do
            fontforge -script nerd-fonts/font-patcher \
              --complete \
              --careful \
              --outputdir patched \
              "$ttf"
          done

      - name: Zip patched fonts
        run: |
          cd patched
          zip -r ../Zenbones-Brainy-NerdFont-TTF.zip *.ttf

      - name: Upload Nerd Font artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenbones-Brainy-NerdFont
          path: Zenbones-Brainy-NerdFont-TTF.zip

  release:
    needs: [build, nerd-font]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} artifacts/*.zip
